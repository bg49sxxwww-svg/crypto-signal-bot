name: Backtest Regression Tests

on:
  push:
    branches: [ "fix/p0-backtest-main", "fix/d-forced-exit-log" ]
  pull_request:
    branches: [ "fix/p0-backtest-main", "experiment/d-tp4-backtest" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run regression tests and capture output
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. pytest -q 2>&1 | tee test-results.txt

      - name: Render test result snapshot
        if: always()
        run: python scripts/render_test_snapshot.py

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-regression-evidence
          path: |
            test-results.txt
            test-results.svg
