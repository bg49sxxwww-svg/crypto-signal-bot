name: Backtest Regression Tests

on:
  push:
    branches: [ "fix/p0-backtest-main" ]
  pull_request:
    branches: [ "fix/p0-backtest-main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run regression tests and capture output
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee test-results.txt

      - name: Render test result snapshot
        if: always()
        run: |
          python - <<'PY'
          from html import escape
          from pathlib import Path
          lines = Path("test-results.txt").read_text(encoding="utf-8").splitlines() if Path("test-results.txt").exists() else ["Test output unavailable"]
          body = "\n".join(lines[-30:])
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520">
          <rect width="100%" height="100%" fill="#111827"/>
          <text x="36" y="48" fill="#93c5fd" font-family="monospace" font-size="24">Crypto Signal Bot - Regression Test</text>
          {''.join(f'<text x="36" y="{90+i*24}" fill="#e5e7eb" font-family="monospace" font-size="16">{escape(line[:130])}</text>' for i,line in enumerate(lines[-17:]))}
          </svg>'''
          Path("test-results.svg").write_text(svg, encoding="utf-8")

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-regression-evidence
          path: |
            test-results.txt
            test-results.svg
