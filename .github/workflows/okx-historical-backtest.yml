name: OKX Historical Backtest

on:
  push:
    branches: [ "fix/p0-backtest-main", "experiment/d-tp4-backtest" ]
    paths:
      - "scripts/run_historical_backtest.py"
      - ".github/workflows/okx-historical-backtest.yml"
  pull_request:
    branches: [ "fix/d-forced-exit-log" ]
    paths:
      - "experiments/d_tp4_backtest.py"
      - "scripts/run_historical_backtest.py"
      - ".github/workflows/okx-historical-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run regression tests first
        run: PYTHONPATH=. pytest -q

      - name: Run OKX historical comparison
        run: PYTHONPATH=. python scripts/run_historical_backtest.py

      - name: Upload historical backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-historical-backtest
          path: historical_backtest_results/
          if-no-files-found: warn
